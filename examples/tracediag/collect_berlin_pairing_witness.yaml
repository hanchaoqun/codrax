# Berlin 大 trace 的 pairing/marker 定向回访包。客户只提供目标窗口与 TID，
# 不复制、不编辑 YAML；零 LLM、纯只读，单行命令只生成一个报告文件。
#
# 用法（单行、单文件、成功后原子替换 --out）：
#   ./codrax --tracediag examples/tracediag/collect_berlin_pairing_witness.yaml --trace <trace文件> --trace-window <start_s>..<end_s> --trace-tid <目标TID> --out berlin_pairing_witness.txt
#
# TID 只绑定 target_window_stats。trace mark、IRQ/softirq/IPI、unknown 以及
# block/storage 原始端点全部保持无 PID/TID selector，避免把偶然 emitter 当成
# 事件 owner 而漏掉跨线程/IRQ/kworker 的对端。marker 车道按 parser-validated
# trace_mark_actions 精确分流，不再用大小写不敏感的 payload 子串 pattern，也不再
# 手改 async payload PID：B/E、C、S、F、G/H、N/I 各自独立、不会互相挤占行帽。
#
# pairing_integrity 从物理文件开头完整重放 block/storage endpoint cohort，自动
# 选择或原子拆分最多 2 个 <=50ms 小窗；raw_io_pairing_rows 只消费这些 typed 窗。
# 若 generated_window_compacted，命令非零退出并披露 matched/emitted，已返回行仍
# 可用，但不得称作 N/N 完整 witness。父窗口建议 <=1s；counter_quality 若出现
# series_budget_exceeded=true，应继续缩小父窗，不能据此宣称该帧无 counter。
#
# 静态最坏预算：66 + discovery(20+12) + target(160+12)
# + 6*marker(50+12) + interrupt(60+12) + 2*io(60+12)
# + unknown(40+12) = 910 行；logical steps=10，最坏
# expanded=9 static + 2 io fan-out = 11。
version: 2
description: "Berlin marker/counter/interrupt + 自动 block/storage pairing witness"
inputs:
  window: required
  tid: required
limits:
  max_generated_windows: 2
  max_expanded_steps: 11
  max_report_lines: 1000
discoveries:
  - label: io_pairing_windows
    strategy: pairing_integrity
    families: [block, storage]
    max_windows: 2
    max_window_ms: 50
    padding_ms: 5
    max_lines: 20
steps:
  - label: target_window_stats
    view: window_stats
    pid_from: tid
    max_lines: 160
  - label: raw_sync_marks
    view: event_search
    event_types: [trace_mark]
    trace_mark_actions: [B, E]
    max_lines: 50
  - label: raw_counter_marks
    view: event_search
    event_types: [trace_mark]
    trace_mark_actions: [C]
    max_lines: 50
  - label: raw_async_starts
    view: event_search
    event_types: [trace_mark]
    trace_mark_actions: [S]
    max_lines: 50
  - label: raw_async_finishes
    view: event_search
    event_types: [trace_mark]
    trace_mark_actions: [F]
    max_lines: 50
  - label: raw_track_marks
    view: event_search
    event_types: [trace_mark]
    trace_mark_actions: [G, H]
    max_lines: 50
  - label: raw_instant_marks
    view: event_search
    event_types: [trace_mark]
    trace_mark_actions: [N, I]
    max_lines: 50
  - label: raw_interrupt_endpoints
    view: event_search
    event_types: [irq, softirq, ipi]
    max_lines: 60
  - label: raw_io_pairing_rows
    view: event_search
    event_types: [block_rq_issue, block_rq_complete, storage_latency]
    windows_from: {discovery: io_pairing_windows}
    max_lines: 60
  - label: raw_unknown_events
    view: event_search
    event_types: [unknown]
    max_lines: 40
