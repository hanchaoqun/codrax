# 开放 gap 通用 witness 包：一份目标窗口同时采结论面、因果面、阻塞面和
# 原始 IO/trace-mark/unknown-print 面。用于 B5/B7/B9/C10/C12/C13、block/storage 请求
# 身份以及 workqueue/DMA 配对格式回访；不替代全文件 format census。
#
# 用法（零 LLM、纯只读）：
#   1) 把四个 `pid: 12345` 改成目标线程 TID；
#   2) 把 defaults.window 改成报告中的精确分析窗（建议 <= 1s）；
#   3) 执行：
#      codrax --tracediag examples/tracediag/collect_open_gap_witness.yaml \
#        --trace <trace文件> --out open_gap_witness.txt
#
# 若只有线程名：删除四个 pid 行，并在这四步各写
#   thread: "comm-tid"
# pid/thread 不能同设。最后两步故意不设 pid/thread：block complete 常由 IRQ/
# kworker 发射，按目标线程过滤会丢掉闭合端；trace mark/unknown print 也需要
# 保留链上对端与非目标进程的格式样本。
#
# 建议同时执行：
#   codrax --tracediag examples/tracediag/collect_format_census.yaml \
#     --trace <trace文件> --out format_census.txt
#
# 回传：open_gap_witness.txt + format_census.txt + 对应最终 .md/.html；无需回传
# 原始 trace。行数预算：220+150+120+100+100+100+80+60=930。
version: 1
description: "开放 gap witness（结论/因果/阻塞 + 原始 IO/trace-mark）"
defaults:
  window: "100.000..100.500"       # <- 占位：改成关注窗口（秒）
steps:
  - label: window_stats_snapshot
    view: window_stats
    pid: 12345                       # <- 占位：目标 TID
    max_lines: 220
  - label: root_cause_rank_snapshot
    view: root_cause_rank
    pid: 12345
    max_lines: 150
  - label: wakeup_chain_snapshot
    view: wakeup_chain
    pid: 12345
    max_lines: 120
  - label: critical_blocking_snapshot
    view: critical_blocking_calls
    pid: 12345
    max_lines: 100
  - label: raw_io_pairing_rows
    view: event_search
    event_types: [block_rq_issue, block_rq_complete, storage_latency]
    max_lines: 100
  - label: raw_workqueue_dma_rows
    view: event_search
    event_types: [workqueue, dma_fence]
    max_lines: 100
  - label: raw_trace_mark_rows
    view: event_search
    event_types: [trace_mark]
    max_lines: 80
  - label: raw_unknown_print_rows
    view: event_search
    event_types: [unknown]
    max_lines: 60
