# 开放 gap 通用 witness 包：一份目标窗口同时采结论面、因果面、阻塞面和
# 原始 IO/trace-mark/unknown-print 面。用于 B5/B7/B9/C10/C12/C13、block/storage 请求
# 身份以及 workqueue/DMA 配对格式回访；不替代全文件 format census。
#
# 用法（零 LLM、纯只读）：
#   1) 用 --trace-tid 传目标线程 TID；
#   2) 用 --trace-window 传报告中的精确分析窗（建议 <= 1s）；
#   3) 无需编辑 YAML，直接执行：
#      codrax --tracediag examples/tracediag/collect_open_gap_witness.yaml \
#        --trace <trace文件> --trace-window <start_s>..<end_s> --trace-tid <TID> \
#        --out open_gap_witness.txt
#
# 四个原始证据步骤故意不绑定 TID：block complete
# 常由 IRQ/kworker 发射，按目标线程过滤会丢掉闭合端；trace mark/unknown print
# 也需要保留链上对端与非目标进程的格式样本。raw_io_pairing_rows 不再直接吃
# 整个父窗：pairing_integrity 会完整重放端点前缀，自动选择/拆分最多 2 个
# <=50ms 的补采窗。若仍有 event_search compaction，本命令会非零退出并明确写
# matched/emitted，不能把部分行当作 N/N witness；无需再手工猜第二个窗口。
#
# 建议同时执行：
#   codrax --tracediag examples/tracediag/collect_format_census.yaml \
#     --trace <trace文件> --out format_census.txt
#
# 回传：open_gap_witness.txt + format_census.txt + 对应最终 .md/.html；无需回传
# 原始 trace。v2 静态最坏报告预算=966 行（含 discovery/fan-out/header/summary）。
version: 2
description: "开放 gap witness（结论/因果/阻塞 + 自动 IO pairing 补采）"
inputs:
  window: required                  # 漏传 --trace-window 时 fail-loud
  tid: required                     # 漏传 --trace-tid 时 fail-loud
limits:
  max_generated_windows: 2
  max_expanded_steps: 12
  max_report_lines: 1000
discoveries:
  - label: io_pairing_windows
    strategy: pairing_integrity
    families: [block, storage]
    max_windows: 2
    max_window_ms: 50
    padding_ms: 5
    max_lines: 20
steps:
  - label: window_stats_snapshot
    view: window_stats
    pid_from: tid
    max_lines: 130
  - label: root_cause_rank_snapshot
    view: root_cause_rank
    pid_from: tid
    max_lines: 80
  - label: wakeup_chain_snapshot
    view: wakeup_chain
    pid_from: tid
    max_lines: 60
  - label: critical_blocking_snapshot
    view: critical_blocking_calls
    pid_from: tid
    max_lines: 50
  - label: raw_io_pairing_rows
    view: event_search
    event_types: [block_rq_issue, block_rq_complete, storage_latency]
    windows_from: {discovery: io_pairing_windows}
    max_lines: 100
  - label: raw_workqueue_dma_rows
    view: event_search
    event_types: [workqueue, dma_fence]
    max_lines: 100
  - label: raw_trace_mark_rows
    view: event_search
    event_types: [trace_mark]
    max_lines: 80
  - label: raw_unknown_print_rows
    view: event_search
    event_types: [unknown]
    max_lines: 60
